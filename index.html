<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Form Example</title>
</head>
<body style="font-family: sans-serif; margin: 20px;">

    <h1>HTML Form Example</h1>
    <p>This is an example of an HTML4 HTML5 form containing  various input controls:</p>

    <form action="#" method="POST">

        <fieldset style="margin-bottom: 15px;">
            <legend>User Information</legend>
            <div style="margin-bottom: 8px;">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username">
            </div>
            <div style="margin-bottom: 8px;">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div style="margin-bottom: 8px;">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password">
            </div>
        </fieldset>

        <fieldset style="margin-bottom: 15px;">
            <legend>Contact Information</legend>
            <div style="margin-bottom: 8px;">
                <label for="phone">Phone:</label>
                <input type="tel" id="phone" name="phone">
            </div>
            <div style="margin-bottom: 8px;">
                <label for="message" style="vertical-align: top;">Message:</label>
                <textarea id="message" name="message" rows="4" cols="35"></textarea>
            </div>
        </fieldset>

        <fieldset style="margin-bottom: 15px;">
            <legend>Subscription</legend>
            <div style="margin-bottom: 5px;">
                <label>Subscribe to newsletter:</label>
                <input type="checkbox" name="newsletter1">
            </div>
            <div>
                <label>Subscribe to newsletter:</label>
                <input type="checkbox" name="newsletter2">
            </div>
        </fieldset>

        <fieldset style="margin-bottom: 15px;">
            <legend>Preferred Language</legend>
            <label for="language">Select your preferred language:</label>
            <select id="language" name="language">
                <option value="english">English</option>
                <option value="spanish">Spanish</option>
                <option value="french">French</option>
                <option value="german">German</option>
            </select>
        </fieldset>

        <fieldset style="margin-bottom: 15px;">
            <legend>Feedback</legend>
            <label for="rating">Rate our service:</label>
            <input type="range" id="rating" name="rating" min="1" max="10" style="vertical-align: middle;">
        </fieldset>

        <div>
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
        </div>

    </form>

</body>
</html>
